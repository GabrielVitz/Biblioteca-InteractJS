<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="style.css">

    <title>Alterando o DOM com a biblioteca</title>

    <script src="https://cdn.jsdelivr.net/npm/interactjs/dist/interact.min.js"></script>
    <script src="index.js" ></script>
</head>

<body>
    
    <div id="frame">

        <div id="Left">
           
            <div id="PredioMain" class="Predio" role="button" tabindex="0">
            <p>Predio </p>

           </div>

           <div id="BlocoMain" class="Bloco" role="button" tabeindex="0">
            <p>Bloco</p>
           </div>
        </div>



        <div id="Right">
           
        </div>

        <div id="ModalZone">
            <div id="MainContent">
                Cadastrar Predio
                <div id="Main-inputs">

                    <div class="Input">
                        Nome
                        <input type="text" class="inputTXT" name="nome" placeholder="Nome" >
                    </div>
                              
                    <div class="Input">
                        Qtd. pisos
                        <input type="number" class="inputTXT" name="qtdPisos" placeholder="Quantidade de pisos" >
                    </div>
                    
                    <div id="buttons">
                        <button class="btn-cadastro">Cadastrar</button>
                    </div>
                </div>
            </div>
        </div>


        <dialog id="form-cadastro">
            <label>Nome</label>
            <input type="text">
            <button>FECHAR</button>
        </dialog>
    </div>
    
</body>
</html>
