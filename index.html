<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="style.css">

    <title>Alterando o DOM com a biblioteca</title>

    <script src="https://cdn.jsdelivr.net/npm/interactjs/dist/interact.min.js"></script>
    
</head>

<body>
    
    <div id="frame">

        <div id="Left">
           
            <div id="PredioMain" class="Predio" role="button" tabindex="0">
            <p>Predio </p>

           </div>

           <div id="BlocoMain" class="Bloco" role="button" tabeindex="0">
            <p>Bloco</p>
           </div>
        </div>



        <div id="Right">
            
        </div>

        <dialog id="form-cadastro-predio" class="modal">
            
            <div class="ModalZone">
                
                <div class="MainContent">
                    <div class="header-form">
                        <button id="closeModalPredio">Fechar</button>                        
                        <h3 id="Title-predio"> Cadastrar Predio </h3>
                    </div>
                    <div class="Main-inputs">

                        <div class="Input">
                            Nome
                            <input type="text" class="inputTXT" id="nomePredio" placeholder="Nome" >
                        </div>
                                
                        <div class="Input">
                            Qtd. pisos
                            <input type="number" class="inputTXT" id="qtdPisos" placeholder="Quantidade de pisos" >
                        </div>
                        
                        <div class="buttons">
                            <button id="Cadastrar-Predio">Cadastrar</button>
                        </div>
                    </div>
                </div>
           
            </div>
        
        </dialog>

        <dialog id="form-cadastro-bloco" class="modal">
            
            <div class="ModalZone">
                
                <div class="MainContent">
                    <div class="header-form">
                        <button id="closeModalBloco">Fechar</button>                        
                        <h3> Cadastrar Bloco </h3>
                    </div>
                    <div class="Main-inputs">

                        <div class="Input">
                            Nome
                            <input type="text" class="inputTXT" name="nomeBloco" placeholder="Nome" >
                        </div>
                                
                        <div class="Input">
                            Selecione um piso
                            <input type="select" class="inputTXT" name="selectPiso" placeholder="Quantidade de pisos" >
                        </div>
                        
                        <div class="buttons">
                            <button id="Cadastrar-Bloco">Cadastrar</button>
                        </div>
                    </div>
                </div>
           
            </div>
        
        </dialog>

    </div>        
    <script type="module" src="index.js" ></script>
</body>
</html>
